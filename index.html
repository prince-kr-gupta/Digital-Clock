<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>

    <div class="hero">
        
        <h1 id="head">Digital Clock</h1>
        <div class="container">
            <div class="clock">
                <span id="hrs">00</span>
                <div class="colon">:</div>
                <span id="min">00</span>
                <div class="colon">:</div>
                <span id ="sec">00</span>
                <div class="colon">:</div>
                <span id ="milli">00</span>
            </div>
        </div>
        <h1 class="stopwatch-heading">Stopwatch</h1>

        <div class="stopwatch">
            <div class="stopwatch-time">
                <span id="sHours">00</span>:
                <span id="sMinutes">00</span>:
                <span id="sSeconds">00</span>:
                <span id="sMilli">00</span>
            </div>
            <div class = "buttons">
                <button id="start">Start</button>
                <button id="stop">Stop</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
